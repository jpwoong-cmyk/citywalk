<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Downtown Three.js City</title>
  <link rel="stylesheet" href="./style.css" />

  <!-- No npm / Node required. Three.js is loaded directly from a CDN. -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>
</head>

<body>
  <main id="app" aria-label="Interactive 3D downtown city">
    <canvas id="city-canvas"></canvas>

    <section class="city-hud" aria-label="City controls">
      <div>
        <p class="eyebrow">THREE.JS ASSET TEST</p>
        <h1>Downtown</h1>
        <p class="subtitle">Built from your Quaternius Downtown City MegaKit assets.</p>
      </div>

      <div class="control-copy">
        <span><strong>Drag</strong> rotate</span>
        <span><strong>Wheel</strong> zoom</span>
        <span><strong>WASD</strong> move</span>
        <span><strong>R</strong> reset view</span>
      </div>
    </section>

    <div id="loading" class="loading-panel" role="status" aria-live="polite">
      <div class="loading-bar"><span id="loading-bar-fill"></span></div>
      <p id="loading-text">Loading city assets…</p>
    </div>

    <div class="credit">
      3D assets: Quaternius · CC0
    </div>
  </main>

  <script type="module" src="./city.js"></script>
</body>
</html>
